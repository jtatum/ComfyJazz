<html>
	<head>
		<!-- web/vendor is filled in by npm install, see copy-libraries.js -->
		<script src="web/vendor/howler.min.js"></script>
		<script src="web/vendor/comfy.min.js"></script>
		<script src="web/ComfyJazz.js"></script>

		<style>
			#comfy-controls {
				padding:40px;
				background-color:#ccc;
				display:block;
			}

			#comfy-controls.hide {
				display:none;
			}

			#start-overlay {
				position: fixed;
				inset: 0;
				background: rgba(0, 0, 0, 0.8);
				display: flex;
				align-items: center;
				justify-content: center;
				cursor: pointer;
				z-index: 1000;
			}

			#start-overlay.hide {
				display: none;
			}

			#start-overlay span {
				color: white;
				font-size: 2rem;
				font-family: sans-serif;
			}
		</style>
	</head>
	<body>
		<div id="start-overlay" class="hide"><span>Click to start</span></div>
		<div id="comfy-controls" class="hide">
			<h1>Comfy Jazz Control Panel</h1>
			<label for="">Volume:
				<input type="range" min=0 max=1 step="0.05" onchange="onVolumeChange(event)">
			</label>
		</div>
	<script>

	const params = new URLSearchParams(location.search);

	const instrument = params.get("instrument");
	const song = params.get("song");
	const volume = params.get("volume");

	//Start ComfyJazz
	const comfyJazz = ComfyJazz({
		autoNotesChance:0.3,
		instrument: instrument, //if it's not in the URL, the song picks (or piano)
		song: song || "comfy",
		volume: volume || 1
	});
	comfyJazz.start();

	//Browsers hold sound back until you click the page, unless they've been told not to (OBS browser
	//sources are), so only ask for a click if that's what's happening
	const audioContext = Howler.ctx;
	if (audioContext && audioContext.state !== 'running') {
		const overlay = document.getElementById('start-overlay');
		overlay.classList.remove('hide');
		overlay.addEventListener('click', () => audioContext.resume());
		//a key press anywhere works too (Howler listens for those)
		audioContext.addEventListener('statechange', () => {
			if (audioContext.state === 'running') {
				overlay.classList.add('hide');
			}
		});
	}

	//Integrate with Twitch Chat
	const channel = params.get("channel");

	if( channel ) {
		ComfyJS.onChat = (user, message, flags, self, extra) => {
			comfyJazz.playNoteProgression((Math.random() * 8) >> 0);
		};
		ComfyJS.Init(channel);
	}

	//Keydown triggers notes
	window.addEventListener("keydown", (e) => {

		//c will open the control panel
		if( e.code === "KeyC" ) {
			document.querySelector("#comfy-controls").classList.toggle('hide');
		} else {
			// comfyJazz.playNote();
			comfyJazz.playNoteProgression((Math.random() * 8) >> 0);
		}
	});

	function onVolumeChange(e) {
		comfyJazz.setVolume(e.currentTarget.value);
	}

	</script>
	</body>
</html>
